<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMAN DICTIONARY // TERMINAL NODE 01</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #d1d5db;
            --accent-color: #22c55e;
            --dim-color: #6b7280;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-stack);
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            border-bottom: 1px solid #262626;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .system-info {
            color: var(--dim-color);
            font-size: 12px;
        }

        .system-info span {
            color: var(--accent-color);
        }

        #terminal-output {
            flex-grow: 1;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .line {
            margin-bottom: 4px;
        }

        .command-line {
            display: flex;
            align-items: center;
            border-top: 1px solid #262626;
            padding-top: 12px;
        }

        .prompt {
            color: var(--accent-color);
            margin-right: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: var(--font-stack);
            font-size: 14px;
            flex-grow: 1;
            outline: none;
        }

        .media-container {
            margin-top: 15px;
            max-width: 480px;
            border: 1px solid #262626;
            padding: 8px;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        footer {
            margin-top: auto;
            padding-top: 20px;
            color: var(--dim-color);
            font-size: 11px;
            border-top: 1px solid #171717;
        }
    </style>
</head>
<body>

    <header>
        <div class="system-info">[system: human_dictionary] // [status: <span>active_node</span>]</div>
        <div class="system-info">[protocol: hmby_g] // [location: archive_node_01]</div>
    </header>

    <div id="terminal-output">
        <div class="line">core_archive_initialized // type 'help' for available commands.</div>
    </div>

    <div class="command-line">
        <span class="prompt">hmby_g@human_dictionary:~$</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <footer>
        hmby_g // hmby studio
    </footer>

<script>
        const input = document.getElementById('command-input');
        const output = document.getElementById('terminal-output');

        const commands = {
            'help': 'AVAILABLE COMMANDS:\n  help        - show list of system commands\n  list        - list active video archive blocks\n  manifesto   - display core project manifesto\n  mag [id]    - view magazine issue (e.g. mag 01)\n  play [id]   - stream block media (e.g. play 01, play 02, play 03)\n  clear       - clear terminal screen',
            'manifesto': 'HUMAN DICTIONARY MANIFESTO:\n--------------------------------------------------\nTECHNICAL DOCUMENTATION AND MEDIA ARCHIVE\nANALYZING LAYERS OF DIGITAL AND PHYSICAL CONSCIOUSNESS.\nPROTOCOL: HMBY_G MECHANICAL DISCIPLINE.\n--------------------------------------------------',
            'list': 'ARCHIVE INDEX:\n  [01] Phantom Spectrum Rec 01\n  [02] Phantom Spectrum Rec 02\n  [03] Phantom Spectrum Rec 03\n  [04] Phantom Spectrum Rec 04\n  [05] Phantom Spectrum Rec 05\n\ntype "play [id]" to view block media.'
        };

        const mediaFiles = {
            '01': '01.mp4',
            '02': '02.mp4',
            '03': '03.mp4',
            '04': '04.mp4',
            '05': '05.mp4'
        };

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const fullCommand = this.value.trim();
                const args = fullCommand.split(' ');
                const cmd = args[0].toLowerCase();
                const param = args[1];

                appendOutput(`hmby_g@human_dictionary:~$ ${fullCommand}`);

                if (cmd === 'clear') {
                    output.innerHTML = '';
                } else if (cmd === 'mag' || cmd === 'issue') {
                    if (param === '01' || param === '1' || !param) {
                        appendOutput('loading issue_01 archive...');
                        appendMagazine();
                    } else {
                        appendOutput(`error: issue [${param}] not found.`);
                    }
                } else if (cmd === 'play') {
                    if (param && mediaFiles[param]) {
                        appendOutput(`streaming block [${param}]...`);
                        appendMedia(mediaFiles[param]);
                    } else {
                        appendOutput('error: invalid block id. use "list" to see available blocks.');
                    }
                } else if (commands[cmd]) {
                    appendOutput(commands[cmd]);
                } else if (cmd !== '') {
                    appendOutput(`command not found: ${cmd}. type "help" for available commands.`);
                }

                this.value = '';
            }
        });

        function appendOutput(text) {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerText = text;
            output.appendChild(line);
        }

        function appendMedia(fileName) {
            const container = document.createElement('div');
            container.className = 'media-container';
            container.innerHTML = `<video controls autoplay loop muted playsinline src="${fileName}"></video>`;
            output.appendChild(container);
        }

        function appendMagazine() {
            const container = document.createElement('div');
            container.className = 'magazine-container';
            container.style.cssText = 'margin: 15px 0; padding: 15px; border-left: 2px solid #fff; background: rgba(255,255,255,0.03);';
            container.innerHTML = `
                <div style="font-weight: bold; font-size: 1.1em; color: #fff; margin-bottom: 5px;">PHANTOM_SPECTRUM_MAG // ISSUE_01</div>
                <div style="font-size: 0.8em; opacity: 0.7; margin-bottom: 12px;">CREATOR: HÜSEYİN HÜSNÜ YAMAN // SYSTEM: HMBY STUDIO</div>
                <div style="font-size: 0.85em; line-height: 1.5; color: #aaa;">
                    [SPECIFICATION DATA]<br>
                    - REF: VOL.04_FORENSIC_BIOLOGICAL_ARCHIVE<br>
                    - STATUS: SYSTEM_ONLINE<br>
                    - RESOLUTION: 1080x1350 (9:16)<br>
                    - DURATION: 68_SEC<br><br>
                    Use "play 01" to stream associated block media.
                </div>
            `;
            output.appendChild(container);
        }
    </script>

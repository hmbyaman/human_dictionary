<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMAN DICTIONARY // TERMINAL</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }
        #terminal {
            max-width: 800px;
            margin: 0 auto;
        }
        .line {
            margin-bottom: 5px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            margin-right: 10px;
            color: #00ff66;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: monospace;
            font-size: 1em;
            outline: none;
            width: 100%;
        }
        .media-container, .magazine-container {
            margin: 15px 0;
            padding: 10px;
            border-left: 2px solid #00ff66;
            background: rgba(0, 255, 102, 0.05);
        }
        video {
            max-width: 100%;
            display: block;
            margin-top: 10px;
            border: 1px solid #00ff66;
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="terminal-output">
            <div class="line">HUMAN DICTIONARY TERMINAL [VERSION 1.0.8]</div>
            <div class="line">TYPE "help" FOR AVAILABLE COMMANDS.</div>
            <div class="line">--------------------------------------------------</div>
        </div>
        <div class="input-line">
            <span class="prompt">hmby_g@human_dictionary:~$</span>
            <input type="text" id="command-input" autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const input = document.getElementById('command-input');
        const output = document.getElementById('terminal-output');

        const commands = {
            'help': 'AVAILABLE COMMANDS:\n  help        - show list of system commands\n  list        - list active video archive blocks\n  manifesto   - display core project manifesto\n  mag 01      - stream issue 01 magazine video\n  play [id]   - stream block media (e.g. play 01, play 04)\n  clear       - clear terminal screen',
            'manifesto': 'HUMAN DICTIONARY MANIFESTO:\n--------------------------------------------------\nTECHNICAL DOCUMENTATION AND MEDIA ARCHIVE\nANALYZING LAYERS OF DIGITAL AND PHYSICAL CONSCIOUSNESS.\nPROTOCOL: HMBY_G MECHANICAL DISCIPLINE.\n--------------------------------------------------',
            'list': 'ARCHIVE INDEX:\n  [01] Phantom Spectrum Rec 01\n  [02] Phantom Spectrum Rec 02\n  [03] Phantom Spectrum Rec 03\n  [04] Phantom Spectrum Rec 04\n  [05] Phantom Spectrum Rec 05\n\ntype "play [id]" to view block media.'
        };

        const mediaFiles = {
            '01': '01.mp4',
            '02': '02.mp4',
            '03': '03.mp4',
            '04': '04.mp4',
            '05': '05.mp4'
        };

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const fullCommand = this.value.trim();
                const args = fullCommand.split(' ');
                const cmd = args[0].toLowerCase();
                const param = args[1];

                appendOutput(`hmby_g@human_dictionary:~$ ${fullCommand}`);

                if (cmd === 'clear') {
                    output.innerHTML = '';
                } else if (cmd === 'mag') {
                    if (param === '01' || param === '1' || !param) {
                        appendOutput('loading issue_01 video stream...');
                        appendMagazineVideo('01.mp4');
                    } else {
                        appendOutput(`error: issue [${param}] not found.`);
                    }
                } else if (cmd === 'play') {
                    if (param && mediaFiles[param]) {
                        appendOutput(`streaming block [${param}]...`);
                        appendMedia(mediaFiles[param]);
                    } else {
                        appendOutput('error: invalid block id. use "list" to see available blocks.');
                    }
                } else if (commands[cmd]) {
                    appendOutput(commands[cmd]);
                } else if (cmd !== '') {
                    appendOutput(`command not found: ${cmd}. type "help" for available commands.`);
                }

                this.value = '';
            }
        });

        function appendOutput(text) {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerText = text;
            output.appendChild(line);
        }

        function appendMedia(fileName) {
            const container = document.createElement('div');
            container.className = 'media-container';
            container.innerHTML = `<video controls autoplay loop muted playsinline src="${fileName}"></video>`;
            output.appendChild(container);
        }

        function appendMagazineVideo(fileName) {
            const container = document.createElement('div');
            container.className = 'magazine-container';
            container.innerHTML = `
                <div style="font-weight: bold; font-size: 1.1em; margin-bottom: 5px;">PHANTOM_SPECTRUM_MAG // ISSUE_01</div>
                <div style="font-size: 0.8em; opacity: 0.8; margin-bottom: 12px;">CREATOR: HÜSEYİN HÜSNÜ YAMAN // SYSTEM: HMBY STUDIO</div>
                <div style="font-size: 0.85em; line-height: 1.5; margin-bottom: 10px;">
                    [SPECIFICATION DATA]<br>
                    - REF: VOL.04_FORENSIC_BIOLOGICAL_ARCHIVE<br>
                    - STATUS: SYSTEM_ONLINE<br>
                    - RESOLUTION: 1080x1350 (9:16)<br>
                    - DURATION: 68_SEC
                </div>
                <video controls autoplay loop muted playsinline src="${fileName}"></video>
            `;
            output.appendChild(container);
        }
    </script>
</body>
</html>
